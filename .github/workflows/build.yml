name: Build and deploy

# Пуш в main: собрать образ, опубликовать в GHCR и прописать новый тег в k8s/kustomization.yaml —
# Argo CD подхватит этот коммит и выкатит версию. Pull request: только проверочная сборка.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'functions/**'
      - '**.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Имя и тег образа
        id: vars
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cera-landing" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Прописать новый образ в kustomization.yaml
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          yq -i '(.images[] | select(.name == "cera-landing")) |= (.newName = strenv(IMAGE) | .newTag = strenv(TAG))' k8s/kustomization.yaml
          git diff

      - name: Закоммитить для Argo CD
        env:
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          if git diff --quiet; then
            echo "Тег не изменился — коммит не нужен."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Деплой cera-landing:${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
